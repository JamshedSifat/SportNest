{% extends 'base.html' %}

{% block title %}Logout - SportNest{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center" style="background: #DCFCE7;">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
        <h2 class="text-2xl font-bold mb-4">Ready to leave?</h2>
        <p class="text-gray-600 mb-6">Are you sure you want to logout?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" 
                    class="px-8 py-3 rounded-lg text-white font-bold mr-3"
                    style="background: #EF4444;">
                Yes, Logout
            </button>
            <a href="/" class="px-8 py-3 rounded-lg font-bold border-2 inline-block"
               style="border-color: #22C55E; color: #22C55E;">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
