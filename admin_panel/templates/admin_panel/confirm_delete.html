{% extends 'admin_panel/admin_base.html' %}
{% block title %}Delete {{ type }}{% endblock %}
{% block page_title %}Delete {{ type }}{% endblock %}
{% block content %}
<div class="max-w-xl bg-white rounded-2xl border border-red-100 shadow-sm p-6">
  <p class="text-gray-700 mb-6">Are you sure you want to delete <strong>{{ object }}</strong>?</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button type="submit" class="px-5 py-2.5 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600">Yes, Delete</button>
    <a href="javascript:history.back()" class="px-5 py-2.5 rounded-xl border border-gray-300 font-semibold">Cancel</a>
  </form>
</div>
{% endblock %}
